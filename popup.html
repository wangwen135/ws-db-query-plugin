<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>WS DB Query Viewer</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>

<!-- 遮罩层：未启用站点时显示 -->
<div id="siteOverlay" class="site-overlay">
    <div class="overlay-content">
        <div id="overlayDomain" class="overlay-domain">检测中...</div>
        <button id="overlayEnableBtn" class="overlay-enable-btn" disabled>在当前网站启用插件</button>
    </div>
</div>

<div class="toolbar">
    <button id="clearBtn">清空</button>
    <div id="siteControl" class="site-control-inline" style="display: none;">
        <span id="currentDomain" class="current-domain"></span>
        <button id="siteToggleBtn" class="site-toggle-btn">禁用</button>
    </div>
</div>

<div id="sqlInfo">
    <span id="sqlInfoContent"></span>
    <span class="toolbar-tip">点击标题/序号/单元格进行复制</span>
</div>

<div id="tableContainer"></div>

<div class="footer-toolbar">
    <div id="copyStatus" class="copy-status"></div>
    <div class="button-group">
        <button id="copyJsonBtn" disabled>复制 JSON</button>
        <button id="copyCsvBtn" disabled>复制 CSV</button>
        <button id="copyMdBtn" disabled>复制 Markdown</button>
        <div class="right">
            <button id="exportCsvBtn" disabled>导出 CSV</button>
            <button id="exportXlsxBtn" disabled>导出 Excel</button>
        </div>
    </div>
</div>

<script src="xlsx.full.min.js"></script>
<script src="popup.js"></script>

</body>
</html>
